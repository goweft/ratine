<svg width="1280" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">

<!-- card -->
<rect width="680" height="220" rx="12" fill="#f8f7f4"/>

<!-- ── ILLUSTRATION ─────────────────────────────────────── -->
<g transform="translate(28, 22)">

  <!-- Panel 1: agent memory file -->
  <rect x="0" y="8" width="122" height="158" rx="6"
        fill="#eeecea" stroke="#d3d1c7" stroke-width="1"/>
  <!-- title bar dots -->
  <circle cx="11" cy="19" r="3" fill="#d3d1c7"/>
  <circle cx="22" cy="19" r="3" fill="#d3d1c7"/>
  <circle cx="33" cy="19" r="3" fill="#d3d1c7"/>
  <!-- memory entry lines: normal -->
  <rect x="9"  y="31" width="75" height="5" rx="2" fill="#c8c6bc" opacity="0.9"/>
  <rect x="9"  y="41" width="52" height="5" rx="2" fill="#c8c6bc" opacity="0.8"/>
  <!-- poisoned entry (CRITICAL red) -->
  <rect x="9"  y="51" width="96" height="5" rx="2" fill="#E24B4A" opacity="0.65"/>
  <rect x="9"  y="61" width="63" height="5" rx="2" fill="#c8c6bc" opacity="0.8"/>
  <rect x="9"  y="71" width="80" height="5" rx="2" fill="#c8c6bc" opacity="0.9"/>
  <!-- poisoned entry (HIGH red, dimmer) -->
  <rect x="9"  y="81" width="90" height="5" rx="2" fill="#E24B4A" opacity="0.40"/>
  <rect x="9"  y="91" width="48" height="5" rx="2" fill="#c8c6bc" opacity="0.8"/>
  <rect x="9"  y="101" width="70" height="5" rx="2" fill="#c8c6bc" opacity="0.7"/>
  <!-- credential leak line (amber) -->
  <rect x="9"  y="111" width="86" height="5" rx="2" fill="#e0972a" opacity="0.55"/>
  <rect x="9"  y="121" width="44" height="5" rx="2" fill="#c8c6bc" opacity="0.8"/>
  <rect x="9"  y="131" width="67" height="5" rx="2" fill="#c8c6bc" opacity="0.6"/>
  <rect x="9"  y="141" width="58" height="5" rx="2" fill="#c8c6bc" opacity="0.5"/>
  <!-- blue right-edge accent (matches CAS style) -->
  <rect x="110" y="8"  width="6"  height="158" rx="3" fill="#378ADD" opacity="0.20"/>
  <rect x="112" y="8"  width="3"  height="158" rx="1.5" fill="#378ADD" opacity="0.45"/>

  <!-- Center: scanner bar + magnifying glass -->
  <rect x="133" y="2" width="2.5" height="172" rx="1.25" fill="#378ADD" opacity="0.35"/>
  <!-- magnifying glass -->
  <circle cx="134" cy="87" r="11" fill="none" stroke="#378ADD" stroke-width="1.8" opacity="0.65"/>
  <line  x1="142" y1="95" x2="149" y2="102"
         stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
  <!-- scan beam (subtle horizontal line through memory panel) -->
  <line x1="0" y1="56" x2="130" y2="56"
        stroke="#378ADD" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.25"/>

  <!-- Panel 3: findings / report (green outline, like CAS right panel) -->
  <rect x="148" y="18" width="108" height="148" rx="6"
        fill="#f8f7f4" stroke="#1D9E75" stroke-width="1.5"/>
  <!-- title bar dots -->
  <circle cx="159" cy="28" r="3" fill="#d3d1c7"/>
  <circle cx="170" cy="28" r="3" fill="#d3d1c7"/>

  <!-- CRITICAL finding row -->
  <rect x="157" y="38" width="9"  height="9"  rx="2" fill="#E24B4A" opacity="0.90"/>
  <rect x="171" y="40" width="52" height="4"  rx="2" fill="#E24B4A" opacity="0.45"/>
  <rect x="171" y="47" width="34" height="3"  rx="1.5" fill="#c8c6bc" opacity="0.55"/>

  <!-- HIGH finding row -->
  <rect x="157" y="58" width="9"  height="9"  rx="2" fill="#E24B4A" opacity="0.55"/>
  <rect x="171" y="60" width="46" height="4"  rx="2" fill="#E24B4A" opacity="0.30"/>
  <rect x="171" y="67" width="60" height="3"  rx="1.5" fill="#c8c6bc" opacity="0.55"/>

  <!-- MEDIUM finding row -->
  <rect x="157" y="78" width="9"  height="9"  rx="2" fill="#e0972a" opacity="0.70"/>
  <rect x="171" y="80" width="50" height="4"  rx="2" fill="#e0972a" opacity="0.38"/>
  <rect x="171" y="87" width="38" height="3"  rx="1.5" fill="#c8c6bc" opacity="0.55"/>

  <!-- health score bar (10% filled = COMPROMISED) -->
  <rect x="157" y="100" width="85" height="4" rx="2" fill="#d3d1c7" opacity="0.45"/>
  <rect x="157" y="100" width="10" height="4" rx="2" fill="#E24B4A" opacity="0.80"/>
  <rect x="157" y="108" width="50" height="3" rx="1.5" fill="#c8c6bc" opacity="0.38"/>

  <!-- semantic verdict row: confirm (green) -->
  <rect x="157" y="120" width="9"  height="9"  rx="2" fill="#1D9E75" opacity="0.75"/>
  <rect x="171" y="122" width="44" height="4"  rx="2" fill="#1D9E75" opacity="0.35"/>
  <!-- semantic: false_positive (dimmed gray) -->
  <rect x="157" y="135" width="9"  height="9"  rx="2" fill="#c8c6bc" opacity="0.55"/>
  <rect x="171" y="137" width="48" height="4"  rx="2" fill="#c8c6bc" opacity="0.28"/>

  <!-- green accent pill at bottom (matches CAS right panel) -->
  <rect x="157" y="154" width="32" height="6" rx="3" fill="#1D9E75" opacity="0.28"/>
</g>

<!-- ── TEXT ───────────────────────────────────────────────────── -->
<text x="292" y="88"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="52" font-weight="500" fill="#2c2c2a" letter-spacing="-1.5">ratine</text>
<text x="292" y="118"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="15" font-weight="400" fill="#5f5e5a">agent memory poisoning detector</text>
<text x="292" y="145"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="12" fill="#888780">injected instructions · hidden payloads · belief drift</text>
<text x="292" y="162"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="12" fill="#888780">scan · watch · diff · --semantic</text>

<!-- goweft badge -->
<rect x="292" y="175" width="56" height="22" rx="4"
      fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="320" y="190"
      font-family="monospace" font-size="10" fill="#888780" text-anchor="middle">goweft</text>

</svg>
