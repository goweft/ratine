[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ratine"
version = "0.1.0"
description = "Ratine — Agent memory poisoning detector. Scans AI agent memory for injected instructions, hidden payloads, credential leakage, and belief drift."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "goweft", email = "goweft@proton.me" },
]
keywords = [
    "security", "ai", "agent", "memory", "poisoning", "safety",
    "mcp", "openclaw", "guardrail", "scanner", "owasp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/goweft/ratine"
Repository = "https://github.com/goweft/ratine"
Issues = "https://github.com/goweft/ratine/issues"

[project.scripts]
ratine = "ratine:main"

[tool.setuptools.packages.find]
where = ["src"]
